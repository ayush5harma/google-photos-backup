name: Android
on:
  push:
    paths: ['Android/**', 'Bridge/**', 'VERSION', '.github/workflows/android.yml']
  pull_request:
    paths: ['Android/**', 'Bridge/**', 'VERSION', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: python -m unittest discover -s Android/tests -v
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease assembleDebugAndroidTest
        working-directory: Android
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks-and-reports
          path: |
            Android/app/build/outputs/apk/
            Android/app/build/reports/
