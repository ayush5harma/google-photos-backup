name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Swift tests
        run: swift test
      - name: Python bridge tests
        run: python3 -m unittest discover -s Bridge/tests
      - name: Build app executable
        run: swift build
